name: Deploy Django to VPS

on:
  workflow_run:
    workflows: ["CI - Django Checks"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd ${{ secrets.PROJECT_PATH }}

            echo "Pulling latest code..."
            git pull origin main

            echo "Activating venv..."
            source venv/bin/activate

            echo "Installing requirements..."
            pip install -r requirements.txt

            echo "Running migrations..."
            python3 manage.py migrate --noinput

            echo "Backfilling client users..."
            python3 manage.py backfill_client_users

            echo "Collecting static files..."
            python3 manage.py collectstatic --noinput

            echo "Restarting services..."
            sudo systemctl restart ${{ secrets.SERVICE_NAME }}
            # Celery worker/beat ham yangi kod bilan qayta ishga tushishi shart —
            # aks holda eski task kodi yangi DB sxemasi bilan ishlashda davom etadi.
            if [ -n "${{ secrets.CELERY_SERVICE_NAME }}" ]; then
              sudo systemctl restart ${{ secrets.CELERY_SERVICE_NAME }}
            fi
            if [ -n "${{ secrets.CELERY_BEAT_SERVICE_NAME }}" ]; then
              sudo systemctl restart ${{ secrets.CELERY_BEAT_SERVICE_NAME }}
            fi
            sudo systemctl restart nginx

            echo "Deploy finished!"
